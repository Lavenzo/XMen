<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#091023" />
    <title>X-Men: Mutant Wars</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="arcade">
      <header id="toolbar">
        <strong class="brand">X-MEN <small>MUTANT WARS</small></strong>
        <nav aria-label="Game settings">
          <button id="languageButton">简体中文</button>
          <button id="musicButton">MUSIC ON</button>
          <button id="soundButton">SOUND ON</button>
          <button id="touchButton">TOUCH</button>
          <button id="pauseButton">PAUSE</button>
        </nav>
      </header>

      <section id="viewport">
        <canvas
          id="gameCanvas"
          width="1280"
          height="720"
          tabindex="0"
          aria-label="X-Men game"
        ></canvas>
        <div id="overlay"></div>
        <div class="scanlines" aria-hidden="true"></div>
      </section>

      <section id="touchControls" aria-label="Game controls">
        <div class="dpad">
          <button class="up" data-key="ArrowUp" aria-label="Move up">▲</button>
          <button class="left" data-key="ArrowLeft" aria-label="Move left">
            ◀
          </button>
          <span class="padCenter">X</span>
          <button class="right" data-key="ArrowRight" aria-label="Move right">
            ▶
          </button>
          <button class="down" data-key="ArrowDown" aria-label="Move down">
            ▼
          </button>
        </div>

        <div class="interact">
          <button data-key="KeyE">
            E<small data-label="pickup">PICK UP</small>
          </button>
          <span data-label="landscape">LANDSCAPE RECOMMENDED</span>
        </div>

        <div class="actionPad">
          <button class="jump" data-key="KeyW">
            W<small data-label="jump">JUMP</small>
          </button>
          <button class="special" data-key="KeyD">
            D<small data-label="special">SPECIAL</small>
          </button>
          <button class="attack" data-key="KeyA">
            A<small data-label="attack">ATTACK</small>
          </button>
          <button class="heavy" data-key="KeyS">
            S<small data-label="heavy">HEAVY</small>
          </button>
        </div>
      </section>

      <footer id="helpText"></footer>
      <div id="rotateDevice">
        <div>ROTATE DEVICE FOR BEST EXPERIENCE</div>
        <div>请横屏以获得最佳游戏体验</div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
